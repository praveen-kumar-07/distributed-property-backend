events {
    worker_connections 1024;
}

http {

    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent '
                      'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log custom;

    # US primary, EU backup
    upstream us_backend {
        server backend-us:8000 max_fails=1 fail_timeout=5s;
        server backend-eu:8000 backup;
    }

    # EU primary, US backup
    upstream eu_backend {
        server backend-eu:8000 max_fails=1 fail_timeout=5s;
        server backend-us:8000 backup;
    }

    server {
        listen 80;

        location /us/ {
            proxy_pass http://us_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        location /eu/ {
            proxy_pass http://eu_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}